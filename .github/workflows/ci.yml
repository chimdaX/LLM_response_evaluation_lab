# Continuous integration for LLM Response Evaluation Lab.
#
# Runs offline: no API keys, paid services or model calls. The human benchmark in
# data/benchmark is still being built, so CI only checks that its *data is valid*;
# it never requires the benchmark to be complete or applies quality-score thresholds.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash  # same scripts on Linux, macOS and Windows (Git Bash)

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false  # report every failing platform, not just the first
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      # Actions are pinned to full commit SHAs (immutable); the comment shows the release.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Unit and integration tests (pytest)
        run: python -m pytest -ra

      - name: Validate example and benchmark data
        run: |
          ai-eval validate --data-dir data/examples --strict
          # Benchmark in progress: must be valid, may be incomplete (warnings allowed).
          ai-eval validate --data-dir data/benchmark
          ai-eval status --data-dir data/benchmark

      - name: Scoring and comparison smoke tests
        run: |
          ai-eval score --data-dir data/examples
          ai-eval score --data-dir data/examples --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert len(d) == 10, len(d)"
          ai-eval compare --data-dir data/examples

      - name: Generate sample reports
        run: |
          ai-eval report --data-dir data/examples --output-dir "$RUNNER_TEMP/reports"
          python scripts/check_reports.py "$RUNNER_TEMP/reports"

  package:
    name: Build and verify package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      # Builds sdist + wheel, checks their contents, installs the wheel into a fresh
      # virtual environment and runs the CLI from an empty directory.
      - name: Clean-install verification
        run: python scripts/verify_install.py --dist-dir dist

      - name: Check package metadata (twine)
        run: python -m twine check --strict dist/*

      - name: Upload built distributions
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14
