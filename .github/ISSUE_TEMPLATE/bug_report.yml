name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not paste credentials, personal data, or private prompts.
  - type: input
    id: version
    attributes:
      label: ai-eval version
      description: Output of `ai-eval --version`
      placeholder: ai-eval 0.4.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12.3
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and full output
      description: The exact command you ran and everything it printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal data to reproduce (optional)
      description: Ideally start from `ai-eval init DIR --example` and describe the change that triggers the bug.
